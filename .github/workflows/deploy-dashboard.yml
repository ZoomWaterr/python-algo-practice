name: 自动部署刷题面板

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write     # 推送 gh-pages 分支
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取全部 git 历史（热力图需要）

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 生成刷题面板
        run: python stats_dashboard.py

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
          commit_message: "📊 自动更新刷题面板 [skip ci]"
